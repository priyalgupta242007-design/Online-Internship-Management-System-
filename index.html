    // --- SMART SKILL MATCHING ALGORITHM ---
    function calculateSkillMatch(studentSkillsInput, requiredSkillsInput) {
      const parseSkills = (input) => {
        if (!input) return [];
        if (Array.isArray(input)) return input.map(s => s.trim().toLowerCase());
        return input.split(/[,;\n]+/).map(s => s.trim().toLowerCase()).filter(s => s.length > 0);
      };

      const studentSkills = parseSkills(studentSkillsInput);
      const requiredSkills = parseSkills(requiredSkillsInput);

      if (requiredSkills.length === 0) {
        return {
          matchPercentage: 100,
          matchedSkills: [],
          missingSkills: [],
          recommendation: 'No mandatory technical requirements. Great opportunity to apply!',
          isEligible: true
        };
      }

      const isMatch = (u, r) => {
        const cu = u.replace(/[^a-z0-9]/g, '');
        const cr = r.replace(/[^a-z0-9]/g, '');
        return cu === cr || cu.includes(cr) || cr.includes(cu);
      };

      const matched = [];
      const missing = [];

      requiredSkills.forEach(req => {
        if (studentSkills.some(userSkill => isMatch(userSkill, req))) {
          matched.push(req);
        } else {
          missing.push(req);
        }
      });

      const percentage = Math.round((matched.length / requiredSkills.length) * 100);

      let recommendation = '';
      if (percentage === 100) {
        recommendation = 'Perfect Match! Your skills align with all stated criteria.';
      } else if (percentage >= 75) {
        recommendation = `High Match! Brush up on ${missing.slice(0, 2).join(' & ')} before technical interviews.`;
      } else if (percentage >= 50) {
        recommendation = `Moderate Match. Build a project utilizing ${missing.slice(0, 2).join(' and ')} to improve your profile.`;
      } else {
        recommendation = `Skill Gap. Consider taking tutorials in ${missing.slice(0, 3).join(', ')}.`;
      }

      return {
        matchPercentage: percentage,
        matchedSkills: matched,
        missingSkills: missing,
        recommendation,
        isEligible: percentage >= 50
      };
    }

    // --- CSV EXPORTER ---
    function exportToCSV(data, filename = 'internportal-export.csv') {
      if (!data || !data.length) {
        alert('No data available to export.');
        return;
      }
      const headers = Object.keys(data[0]);
      const csvRows = [headers.join(',')];
      for (const row of data) {
        const values = headers.map(header => {
          const escaped = ('' + (row[header] ?? '')).replace(/"/g, '""');
          return `"${escaped}"`;
        });
        csvRows.push(values.join(','));
      }
      const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', filename);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

                          <div>
                            <h3>{app.studentName}</h3>
                            <div style={{ fontSize: '0.85rem', color: 'var(--slate-600)' }}>
                              {app.studentCollege} • CGPA: {app.studentCgpa} • {app.studentEmail}
                            </div>
                            <div style={{ fontSize: '0.85rem', color: 'var(--primary-700)', fontWeight: 600, marginTop: '4px' }}>
                              Applied for: {app.internshipTitle}
                            </div>
                          </div>

                          <div style={{ textAlign: 'right' }}>
                            <span className="skill-match-pill match-high">✨ {app.skillMatchPercentage}% Skill Match</span>
                            <div style={{ marginTop: '4px' }}><span className="badge badge-blue">{app.status}</span></div>
                          </div>
                        </div>

                        <div style={{ margin: '14px 0', padding: '10px', background: 'var(--slate-50)', borderRadius: 'var(--radius-md)', fontSize: '0.85rem' }}>
                          <strong>Skills:</strong> {app.studentSkills}
                        </div>

                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                          <button onClick={() => handleStatusUpdate(app.id, 'SHORTLISTED')} className="btn btn-outline-primary btn-sm">
                            Shortlist
                          </button>
                          <button onClick={() => handleScheduleInterview(app)} className="btn btn-primary btn-sm">
                            📅 Schedule Interview
                          </button>
                          <button onClick={() => handleStatusUpdate(app.id, 'SELECTED')} className="btn btn-success btn-sm">
                            Select & Offer
                          </button>
                          <button onClick={() => handleStatusUpdate(app.id, 'REJECTED')} className="btn btn-danger btn-sm">
                            Reject
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 6. POST INTERNSHIP */}
            {currentPage === 'post-internship' && (
              <div style={{ padding: '36px 0' }}>
                <div className="container" style={{ maxWidth: '700px' }}>
                  <div className="card" style={{ padding: '32px' }}>
                    <h2 style={{ marginBottom: '20px' }}>Publish New Internship Opening</h2>
                    <form onSubmit={handlePostInternship}>
                      <div className="form-group">
                        <label className="form-label">Job Title</label>
                        <input name="title" className="form-input" defaultValue="Full Stack React & Spring Boot Intern" required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Domain</label>
                        <select name="domain" className="form-select">
                          <option value="Web Development">Web Development</option>
                          <option value="Data Science & AI">Data Science & AI</option>
                          <option value="Cloud & DevOps">Cloud & DevOps</option>
                          <option value="Backend Development">Backend Development</option>
                        </select>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                        <div className="form-group">
                          <label className="form-label">Monthly Stipend (INR ₹)</label>
                          <input name="stipendAmount" type="number" className="form-input" defaultValue="25000" required />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Duration (Months)</label>
                          <input name="durationMonths" type="number" className="form-input" defaultValue="6" required />
                        </div>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                        <div className="form-group">
                          <label className="form-label">Work Mode</label>
                          <select name="workMode" className="form-select">
                            <option value="REMOTE">Remote</option>
                            <option value="HYBRID">Hybrid</option>
                            <option value="IN_OFFICE">In-Office</option>
                          </select>
                        </div>
                        <div className="form-group">
                          <label className="form-label">Location</label>
                          <input name="location" className="form-input" defaultValue="Bengaluru, Karnataka" required />
                        </div>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                        <div className="form-group">
                          <label className="form-label">Openings</label>
                          <input name="openingsCount" type="number" className="form-input" defaultValue="3" required />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Min CGPA</label>
                          <input name="minCgpa" type="number" step="0.1" className="form-input" defaultValue="7.5" required />
                        </div>
                      </div>
                      <div className="form-group">
                        <label className="form-label">Required Skills (Comma-separated)</label>
                        <input name="requiredSkills" className="form-input" defaultValue="React.js, JavaScript, Spring Boot, MySQL, Git" required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Job Description</label>
                        <textarea name="description" className="form-textarea" rows="3" defaultValue="Exciting engineering internship building cloud microservices." required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Responsibilities</label>
                        <textarea name="responsibilities" className="form-textarea" rows="2" defaultValue="• Design frontend components\n• Write REST APIs" />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Requirements</label>
                        <textarea name="requirements" className="form-textarea" rows="2" defaultValue="• Enrolled in engineering program" />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Application Deadline</label>
                        <input name="applicationDeadline" type="date" className="form-input" defaultValue="2026-12-30" required />
                      </div>

                      <button type="submit" className="btn btn-primary btn-lg" style={{ width: '100%' }}>
                        Publish Opening
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* 7. RECRUITER DASHBOARD */}
            {currentPage === 'recruiter-dashboard' && (
              <div style={{ padding: '36px 0' }}>
                <div className="container">
                  <div style={{ background: 'linear-gradient(135deg, #0f172a, #1e293b)', color: '#fff', padding: '28px', borderRadius: 'var(--radius-xl)', marginBottom: '28px' }}>
                    <h2>Recruiter Console • {user.companyName}</h2>
                    <p style={{ color: '#cbd5e1' }}>Manage campus hiring drives, view applicants, and schedule video calls.</p>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '20px', marginBottom: '32px' }}>
                    <div className="card" style={{ padding: '20px' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--slate-500)' }}>ACTIVE ROLES</span>
                      <h3 style={{ fontSize: '1.8rem', color: 'var(--primary-600)' }}>{internships.length}</h3>
                    </div>
                    <div className="card" style={{ padding: '20px' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--slate-500)' }}>TOTAL APPLICANTS</span>
                      <h3 style={{ fontSize: '1.8rem', color: 'var(--purple-700)' }}>{applications.length}</h3>
                    </div>
                    <div className="card" style={{ padding: '20px' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--slate-500)' }}>SCHEDULED MEETS</span>
                      <h3 style={{ fontSize: '1.8rem', color: 'var(--warning-700)' }}>{interviews.length}</h3>
                    </div>
                  </div>

                  <div style={{ display: 'flex', gap: '12px' }}>
                    <button onClick={() => setCurrentPage('applicants')} className="btn btn-primary">
                      Manage Applicants →
                    </button>
                    <button onClick={() => setCurrentPage('post-internship')} className="btn btn-secondary">
                      + Post New Role
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 8. ADMIN DASHBOARD */}
            {currentPage === 'admin-dashboard' && (
              <div style={{ padding: '36px 0' }}>
                <div className="container">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
                    <div>
                      <h2>Campus Placement Administration</h2>
                      <p style={{ color: 'var(--slate-500)' }}>Overall drive analytics and conversion funnel statistics.</p>
                    </div>
                    <button
                      onClick={() => {
                        const exportData = applications.map(a => ({
                          'ID': a.id,
                          'Student': a.studentName,
                          'College': a.studentCollege,
                          'Role': a.internshipTitle,
                          'Status': a.status
                        }));
                        exportToCSV(exportData, 'Placement_Summary.csv');
                      }}
                      className="btn btn-primary"
                    >
                      Export Placement Report (CSV)
                    </button>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '20px', marginBottom: '32px' }}>
                    <div className="card" style={{ padding: '20px' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--slate-500)' }}>ENROLLED STUDENTS</span>
                      <h3 style={{ fontSize: '1.8rem', color: 'var(--primary-600)' }}>1,250</h3>
                    </div>
                    <div className="card" style={{ padding: '20px' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--slate-500)' }}>ACTIVE INTERNSHIPS</span>
                      <h3 style={{ fontSize: '1.8rem', color: 'var(--navy-900)' }}>{internships.length}</h3>
                    </div>
                    <div className="card" style={{ padding: '20px' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--slate-500)' }}>TOTAL APPLICATIONS</span>
                      <h3 style={{ fontSize: '1.8rem', color: 'var(--warning-700)' }}>{applications.length}</h3>
                    </div>
                    <div className="card" style={{ padding: '20px' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--slate-500)' }}>OFFERS RELEASED</span>
                      <h3 style={{ fontSize: '1.8rem', color: 'var(--success-700)' }}>
                        {applications.filter(a => a.status === 'SELECTED').length}
                      </h3>
                    </div>
                  </div>

                  <div className="card" style={{ padding: '24px' }}>
                    <h3 style={{ marginBottom: '16px' }}>Application Funnel Breakdown</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      {['APPLIED', 'UNDER_REVIEW', 'SHORTLISTED', 'INTERVIEW_SCHEDULED', 'SELECTED'].map(st => {
                        const cnt = applications.filter(a => a.status === st).length;
                        return (
                          <div key={st}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem', fontWeight: 600, marginBottom: '4px' }}>
                              <span>{st.replace('_', ' ')}</span>
                              <span>{cnt} candidates</span>
                            </div>
                            <div style={{ height: '8px', background: 'var(--slate-100)', borderRadius: '999px', overflow: 'hidden' }}>
                              <div style={{ height: '100%', width: `${Math.max(cnt * 30, 10)}%`, background: 'var(--primary-600)' }} />
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 9. STUDENT PROFILE */}
            {currentPage === 'profile' && (
              <div style={{ padding: '36px 0' }}>
                <div className="container" style={{ maxWidth: '700px' }}>
                  <div className="card" style={{ padding: '32px' }}>
                    <h2 style={{ marginBottom: '20px' }}>Verified Student Profile</h2>
                    <div className="form-group">
                      <label className="form-label">Full Name</label>
                      <input className="form-input" defaultValue={user.name} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">College / University</label>
                      <input className="form-input" defaultValue={user.collegeName || 'National Institute of Engineering'} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Skills</label>
                      <input className="form-input" defaultValue={user.skills} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">PDF Resume</label>
                      <div style={{ padding: '16px', background: 'var(--slate-50)', borderRadius: 'var(--radius-md)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span>📄 {user.resumeFileName || 'Aarav_Sharma_Resume.pdf'} (95% Completeness)</span>
                        <button onClick={() => alert('Resume updated!')} className="btn btn-secondary btn-sm">Upload New</button>
                      </div>
                    </div>
                    <button onClick={() => alert('Profile saved!')} className="btn btn-primary" style={{ marginTop: '16px' }}>
                      Save Profile Changes
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 10. ABOUT US */}
            {currentPage === 'about' && (
              <div style={{ padding: '48px 0' }}>
                <div className="container" style={{ maxWidth: '800px', textAlign: 'center' }}>
                  <span className="badge badge-blue" style={{ marginBottom: '12px' }}>Academic Mini-Project</span>
                  <h1 style={{ marginBottom: '16px' }}>About InternPortal</h1>
                  <p style={{ color: 'var(--slate-600)', lineHeight: 1.6, marginBottom: '32px' }}>
                    Built with React.js, Java Spring Boot, and MySQL. Provides smart skill matching, transparent application pipelines, and administrative reporting for college campuses.
                  </p>
                  <button onClick={() => setCurrentPage('internships')} className="btn btn-primary">
                    Explore Internships
                  </button>
                </div>
              </div>
            )}

            {/* 11. CONTACT US */}
            {currentPage === 'contact' && (
              <div style={{ padding: '48px 0' }}>
                <div className="container" style={{ maxWidth: '600px' }}>
                  <div className="card" style={{ padding: '32px' }}>
                    <h2 style={{ marginBottom: '16px' }}>Placement Support Desk</h2>
                    <p style={{ color: 'var(--slate-500)', marginBottom: '20px' }}>Contact the college placement office for recruitment assistance.</p>
                    <div className="form-group">
                      <label className="form-label">Name</label>
                      <input className="form-input" defaultValue={user.name} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Message</label>
                      <textarea className="form-textarea" rows="3" placeholder="Enter inquiry..." />
                    </div>
                    <button onClick={() => alert('Inquiry submitted to placement desk!')} className="btn btn-primary" style={{ width: '100%' }}>
                      Send Message
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer style={{ background: '#fff', borderTop: '1px solid var(--slate-200)', padding: '24px 0', textAlign: 'center', fontSize: '0.85rem', color: 'var(--slate-500)' }}>
            <div className="container">
              © 2026 InternPortal – Online Internship Management System • Single-File GitHub & Presentation Edition
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
